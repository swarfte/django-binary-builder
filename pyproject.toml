[project]
name = "django-binary-builder"
version = "0.3.2"
description = "Build Django projects as installable desktop applications with a portable Python runtime"
readme = "README.md"
authors = [
    { name = "Benjamin Chau", email = "68836494+swarfte@users.noreply.github.com" }
]
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "django",
    "pyinstaller",
    "inno-setup",
    "windows",
    "installer",
    "desktop",
    "packaging",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "Django>=5.0",
    "jinja2>=3.1.6,<4.0",
    "pyinstaller>=6.22.2,<7.0",
    "python-dotenv>=1.1,<2.0",
]

[project.urls]
Homepage = "https://github.com/swarfte/django-binary-builder"
Repository = "https://github.com/swarfte/django-binary-builder"
Issues = "https://github.com/swarfte/django-binary-builder/issues"

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-django>=4.14.0,<5.0",
    "ruff>=0.16.4,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
